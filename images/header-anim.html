<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Performance Generative Art</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #e6e7ec;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import canvasSketch from 'https://cdn.skypack.dev/canvas-sketch';
      import random from 'https://cdn.skypack.dev/canvas-sketch-util/random';
      import math from 'https://cdn.skypack.dev/canvas-sketch-util/math';

      const settings = {
        animate: true,
        dimensions: [window.innerWidth, window.innerHeight],
      };

      const sketch = ({ width, height }) => {
        const numBodies = 3;
        const numDotsPerBody = 450; 
        const bodies = [];
        const maxDist = 80;
        const maxDistSq = maxDist * maxDist;
        const cellSize = maxDist;

        for (let i = 0; i < numBodies; i++) {
          const body = {
            center: [random.range(width * 0.2, width * 0.8), random.range(height * 0.2, height * 0.8)],
            dots: Array.from({ length: numDotsPerBody }, (_, id) => ({
              id,
              pos: [random.value(), random.value()],
              baseRadius: Math.abs(random.gaussian() * 0.8) + 0.2,
              screenX: 0,
              screenY: 0,
              screenRadius: 0
            })),
            noiseOffset: random.value() * 1000,
          };
          bodies.push(body);
        }

        const timeSpeed = 0.08;
        const frequency = 0.8;
        const gravity = 0.005;

        return ({ context, time, width, height }) => {
          context.fillStyle = '#e6e7ec';
          context.fillRect(0, 0, width, height);
          
          const t = time * timeSpeed;
          const cols = Math.ceil(width / cellSize);
          const rows = Math.ceil(height / cellSize);

          bodies.forEach(body => {
            // 1. Reset Grid (Using a flat array for speed)
            const grid = Array.from({ length: cols * rows }, () => []);

            // 2. Update Positions & Fill Grid
            for (let i = 0; i < body.dots.length; i++) {
              const dot = body.dots[i];
              const noiseX = random.noise3D(dot.pos[0] * frequency, dot.pos[1] * frequency, t + body.noiseOffset);
              const noiseY = random.noise3D(dot.pos[0] * frequency + 10, dot.pos[1] * frequency + 20, t + body.noiseOffset);
              const noiseR = random.noise3D(dot.pos[0] * frequency + 30, dot.pos[1] * frequency + 40, t + body.noiseOffset) * 0.3;
              
              dot.screenX = math.lerp(math.mapRange(noiseX, -1, 1, 0, width), body.center[0], gravity);
              dot.screenY = math.lerp(math.mapRange(noiseY, -1, 1, 0, height), body.center[1], gravity);
              dot.screenRadius = math.mapRange(noiseR, -1, 1, 0, dot.baseRadius * 2.5);

              const gx = (dot.screenX / cellSize) | 0;
              const gy = (dot.screenY / cellSize) | 0;
              if (gx >= 0 && gx < cols && gy >= 0 && gy < rows) {
                grid[gx + gy * cols].push(dot);
              }
            }

            // 3. Batch Lines by Opacity (Color Binning)
            // We use 10 bins to represent opacity levels from 0.1 to 1.0
            const opacityBins = Array.from({ length: 11 }, () => new Path2D());

            for (let i = 0; i < body.dots.length; i++) {
              const dotA = body.dots[i];
              const gx = (dotA.screenX / cellSize) | 0;
              const gy = (dotA.screenY / cellSize) | 0;

              for (let x = gx - 1; x <= gx + 1; x++) {
                for (let y = gy - 1; y <= gy + 1; y++) {
                  if (x < 0 || x >= cols || y < 0 || y >= rows) continue;
                  
                  const neighbors = grid[x + y * cols];
                  for (let k = 0; k < neighbors.length; k++) {
                    const dotB = neighbors[k];
                    
                    // CRITICAL: Only process if B has a higher ID than A to avoid double-checks
                    if (dotA.id >= dotB.id) continue;

                    const dx = dotA.screenX - dotB.screenX;
                    const dy = dotA.screenY - dotB.screenY;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < maxDistSq) {
                      const dist = Math.sqrt(distSq);
                      const opacity = 1 - dist / maxDist;
                      const binIndex = (opacity * 10) | 0;
                      
                      const path = opacityBins[binIndex];
                      path.moveTo(dotA.screenX, dotA.screenY);
                      path.lineTo(dotB.screenX, dotB.screenY);
                    }
                  }
                }
              }
            }

            // 4. Execute Batched Strokes
            context.lineWidth = 0.5;
            for (let i = 1; i <= 10; i++) {
              context.strokeStyle = `rgba(0, 0, 0, ${i / 10})`;
              context.stroke(opacityBins[i]);
            }

            // 5. Batch Draw Dots
            context.fillStyle = 'black';
            const dotPath = new Path2D();
            for (let i = 0; i < body.dots.length; i++) {
              const dot = body.dots[i];
              dotPath.moveTo(dot.screenX + dot.screenRadius, dot.screenY);
              dotPath.arc(dot.screenX, dot.screenY, dot.screenRadius, 0, Math.PI * 2);
            }
            context.fill(dotPath);
          });
        };
      };

      canvasSketch(sketch, settings);
    </script>
  </body>
</html>
