<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Art - Narrative Streams</title>
    <style>
      /* Synchronized with styles.css palette */
      :root {
        --color-bg: rgb(90.163%, 90.704%, 92.383%);
        --color-dark: rgb(9.0667%, 6.1845%, 13.106%);
        --color-accent: rgba(239, 68, 68, 1);
      }

      body {
        margin: 0;
        overflow: hidden;
        background-color: var(--color-bg); 
      }
      canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import canvasSketch from 'https://cdn.skypack.dev/canvas-sketch';
      import random from 'https://cdn.skypack.dev/canvas-sketch-util/random';
      import math from 'https://cdn.skypack.dev/canvas-sketch-util/math';

      const settings = {
        animate: true,
        dimensions: undefined,
      };

      const sketch = ({ width, height }) => {
        const numStreams = 10;
        const pointsPerStream = 60;
        const streams = [];

        // Color definitions from styles.css
        const darkBase = "23, 16, 33"; // RGB equivalent of var(--color-2)
        const accentBase = "239, 68, 68"; // The red accent

        for (let i = 0; i < numStreams; i++) {
          const isAccent = i % 4 === 0;
          streams.push({
            yBase: (height / (numStreams + 1)) * (i + 1),
            speed: random.range(0.01, 0.025),
            offset: random.value() * 1000,
            color: isAccent ? `rgba(${accentBase}, 0.2)` : `rgba(${darkBase}, 0.12)`,
            accent: isAccent ? `rgba(${accentBase}, 0.7)` : `rgba(${darkBase}, 0.4)`,
            thickness: isAccent ? 2.5 : 1.5,
            noiseScale: random.range(0.4, 0.8),
            particles: Array.from({ length: 3 }, () => ({
              progress: random.value(),
              speed: random.range(0.001, 0.004)
            }))
          });
        }

        return ({ context, time, width, height }) => {
          // Fill background with --color-1
          context.fillStyle = 'rgb(90.163%, 90.704%, 92.383%)';
          context.fillRect(0, 0, width, height);

          const t = time * 0.8;

          streams.forEach((stream, index) => {
            const streamTime = t * stream.speed + stream.offset;
            const points = [];

            // 1. Calculate Wave Geometry
            for (let i = 0; i <= pointsPerStream; i++) {
              const x = (width / pointsPerStream) * i;
              const noiseX = (x * 0.0012) * stream.noiseScale;
              const n = random.noise2D(noiseX, streamTime);
              
              // Influence of the center (more activity in middle)
              const centerDist = Math.pow(1 - Math.abs(x - width / 2) / (width / 2), 0.7);
              const amplitude = 140 * centerDist * n;
              
              const y = stream.yBase + amplitude;
              points.push({ x, y });
            }

            // 2. Draw Stream (Narrative Path)
            context.beginPath();
            context.lineWidth = stream.thickness;
            context.strokeStyle = stream.color;
            context.lineJoin = 'round';
            context.lineCap = 'round';

            points.forEach((p, i) => {
              if (i === 0) context.moveTo(p.x, p.y);
              else context.lineTo(p.x, p.y);
            });
            context.stroke();

            // 3. Draw Information Packets (Data Flow)
            stream.particles.forEach(p => {
              p.progress = (p.progress + p.speed) % 1;
              const idx = (p.progress * pointsPerStream) | 0;
              const nextIdx = (idx + 1) % (pointsPerStream + 1);
              
              const p1 = points[idx];
              const p2 = points[nextIdx];
              const localT = (p.progress * pointsPerStream) % 1;
              
              const px = math.lerp(p1.x, p2.x, localT);
              const py = math.lerp(p1.y, p2.y, localT);

              context.fillStyle = stream.accent;
              // Rectangular "data blocks" feel more like your dashboard UI
              context.fillRect(px - 2, py - 2, 4, 4);
            });

            // 4. Subtle Inter-stream Resonance (Cross-referencing)
            if (index < streams.length - 1 && Math.sin(t * 0.5 + stream.offset) > 0.99) {
              const xIdx = Math.floor(pointsPerStream * random.range(0.3, 0.7));
              const pStart = points[xIdx];
              
              // Find approx Y for next stream
              const nextStream = streams[index + 1];
              const nXNext = (pStart.x * 0.0012) * nextStream.noiseScale;
              const tNext = t * nextStream.speed + nextStream.offset;
              const nNext = random.noise2D(nXNext, tNext);
              const distNext = Math.pow(1 - Math.abs(pStart.x - width / 2) / (width / 2), 0.7);
              const yNext = nextStream.yBase + (140 * distNext * nNext);

              context.beginPath();
              context.strokeStyle = `rgba(${darkBase}, 0.08)`;
              context.setLineDash([2, 4]); // Dotted lines for "latent" connections
              context.moveTo(pStart.x, pStart.y);
              context.lineTo(pStart.x, yNext);
              context.stroke();
              context.setLineDash([]);
            }
          });

          // Textural grain to match paper-like quality of Gelasio font
          context.fillStyle = 'rgba(23, 16, 33, 0.015)';
          for (let i = 0; i < 30; i++) {
            context.fillRect(random.range(0, width), random.range(0, height), 1, 1);
          }
        };
      };

      canvasSketch(sketch, settings);
    </script>
  </body>
</html>
